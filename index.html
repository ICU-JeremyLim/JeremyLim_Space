<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy Lim</title>
  <meta name="description" content="Personal site of Jeremy Lim — linguist, photographer, writer, and Christian.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script data-role="theme-preload">(function(){try{var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>

  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Jeremy Lim</a>
      <div class="nav__links">

        <a href="opinions.html"  class="nav__link">Opinions</a>
        <a href="gallery.html"   class="nav__link">Photos</a>
        <a href="links.html"     class="nav__link">Links</a>
      </div>
      <div class="nav__controls">
        <button class="theme-btn" aria-label="Toggle theme">
          <svg class="icon-sun"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="nav__toggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="nav__mobile">
      <a href="index.html"    class="nav__link">Home</a>
      <a href="research.html" class="nav__link">Research</a>
      <a href="faith.html"    class="nav__link">Faith</a>

      <a href="gallery.html"  class="nav__link">Photos</a>
      <a href="links.html"    class="nav__link">Links</a>
    </div>
  </nav>

  <!-- ===== Profile ===== -->
  <section class="profile">
    <div class="container">
      <div class="profile__grid">

        <div class="profile__photo-wrap reveal">
          <div class="profile__photo" id="profile-photo">Your photo</div>
        </div>

        <div class="reveal">
          <h1 class="profile__name" id="profile-name">Jeremy Lim</h1>
          <p  class="profile__tagline" id="profile-tagline"></p>
          <p  class="profile__bio"    id="profile-bio"></p>

          <div class="profile__meta">
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span id="profile-location"></span>
            </span>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <a href="mailto:" id="profile-email"></a>
            </span>
          </div>

          <div class="profile__socials" id="profile-socials"></div>
        </div>

      </div>
    </div>
  </section>

  <!-- ===== CV Timeline ===== -->
  <section class="cv-section">
    <div class="container">
      <div class="cv-header reveal">
        <div class="section-label">Curriculum Vitae</div>
        <h2 class="section-title">Timeline</h2>
      </div>
      <div class="cv-list reveal" id="cv-list"></div>
    </div>
  </section>

  <!-- ===== Section cards ===== -->
  <section class="modules">
    <div class="container">
      <div class="modules__grid">

        <a href="research.html" class="module-card" data-module="research">
          <div class="module-card__bg"></div>
          <div class="module-card__overlay">
            <div>
              <div class="module-card__title">Research</div>
              <div class="module-card__sub"></div>
            </div>
          </div>
          <div class="module-card__arrow"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>

        <a href="faith.html" class="module-card" data-module="faith">

          <div class="module-card__overlay">

              <div class="module-card__title">Faith</div>

          <div class="module-card__arrow"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
        </a>

        <a href="opinions.html" class="module-card" data-module="opinions">
          <div class="module-card__bg"></div>
          <div class="module-card__overlay">
            <div>
              <div class="module-card__title">Opinions</div>
              <div class="module-card__sub"></div>
            </div>
          </div>
          <div class="module-card__arrow"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
        </a>

        <a href="gallery.html" class="module-card" data-module="photos">
          <div class="module-card__bg"></div>
          <div class="module-card__overlay">
            <div>
              <div class="module-card__title">Photos</div>
              <div class="module-card__sub"></div>
            </div>
          </div>
          <div class="module-card__arrow"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
        </a>

        <a href="links.html" class="module-card" data-module="links">
          <div class="module-card__bg"></div>
          <div class="module-card__overlay">
            <div>
              <div class="module-card__title">Links</div>

            </div>

        <div style="display:flex;gap:1.5rem;">
          <a href="index.html">Home</a>
          <a href="research.html">Research</a>
          <a href="faith.html">Faith</a>
          <a href="opinions.html">Opinions</a>
          <a href="gallery.html">Photos</a>
          <a href="links.html">Links</a>
        </div>
      </div>
    </div>

  <button class="back-to-top" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="js/app.js"></script>
