<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Jeremy Lim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <script data-role="theme-preload">(function(){try{var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>

  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Jeremy Lim</a>
      <div class="nav__links">

        <a href="gallery.html"  class="nav__link">Photos</a>
        <a href="links.html"    class="nav__link">Links</a>
      </div>
      <div class="nav__controls">
        <button class="theme-btn" aria-label="Toggle theme">
          <svg class="icon-sun"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="nav__toggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="nav__mobile">
      <a href="index.html"    class="nav__link">Home</a>
      <a href="articles.html" class="nav__link">Articles</a>
      <a href="gallery.html"  class="nav__link">Photos</a>
      <a href="links.html"    class="nav__link">Links</a>
    </div>
  </nav>

  <!-- Reading progress -->
  <div class="read-progress"><div class="read-progress__bar" id="read-bar"></div></div>

  <article class="reader">
    <div class="container container--narrow">
      <a href="articles.html" class="reader__back">&larr; All articles</a>
      <div class="reader__hero" id="reader-hero" style="display:none"></div>
      <div class="reader__meta" id="reader-meta"></div>
      <h1 class="reader__title" id="reader-title">Loading…</h1>
      <div class="reader__pdf" id="reader-pdf" style="display:none"></div>
      <div class="prose" id="reader-body"></div>
    </div>
  </article>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span>&copy; <span id="yr"></span> Jeremy Lim</span>
        <div style="display:flex;gap:1.5rem;">
          <a href="index.html">Home</a>
          <a href="articles.html">Articles</a>
          <a href="gallery.html">Photos</a>
        </div>
      </div>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="js/app.js"></script>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

</html>
