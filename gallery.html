<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Jeremy Lim</title>
  <meta name="description" content="Photography portfolio by Jeremy Lim.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Jeremy Lim</a>
      <div class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="gallery.html" class="nav__link nav__link--active">Gallery</a>
        <a href="writing.html" class="nav__link">Writing</a>
        <a href="audio.html" class="nav__link">Audio</a>
        <a href="links.html" class="nav__link">Links</a>
        <a href="archive.html" class="nav__link">Archive</a>
      </div>
      <div class="nav__actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="nav__toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="nav__mobile-menu">
      <a href="index.html" class="nav__link">Home</a>
      <a href="gallery.html" class="nav__link nav__link--active">Gallery</a>
      <a href="writing.html" class="nav__link">Writing</a>
      <a href="audio.html" class="nav__link">Audio</a>
      <a href="links.html" class="nav__link">Links</a>
      <a href="archive.html" class="nav__link">Archive</a>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <h1 class="page-header__title animate-in">Gallery</h1>
      <p class="page-header__subtitle animate-in">
        A curated collection of my photography — landscapes, urban scenes, portraits, and moments.
      </p>
    </div>
  </header>

  <!-- Gallery -->
  <section class="section" style="padding-top: 0;">
    <div class="container container--wide">

      <!-- Filter Tabs -->
      <div class="gallery-filters animate-in">
        <button class="gallery-filter-btn is-active" data-filter="all">All</button>
        <button class="gallery-filter-btn" data-filter="landscape">Landscape</button>
        <button class="gallery-filter-btn" data-filter="urban">Urban</button>
        <button class="gallery-filter-btn" data-filter="portrait">Portrait</button>
        <button class="gallery-filter-btn" data-filter="street">Street</button>
        <button class="gallery-filter-btn" data-filter="travel">Travel</button>
      </div>

      <!-- Masonry Gallery Grid — dynamically loaded from content.json -->
      <div class="gallery-grid" id="gallery-grid">
        <!-- Populated by content-loader.js -->
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous">&lsaquo;</button>
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next">&rsaquo;</button>
    <img class="lightbox__img" src="" alt="">
    <div class="lightbox__caption"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span class="footer__text">&copy; 2026 Jeremy Lim. All rights reserved.</span>
        <div class="footer__links">
          <a href="index.html" class="footer__link">Home</a>
          <a href="gallery.html" class="footer__link">Gallery</a>
          <a href="writing.html" class="footer__link">Writing</a>
          <a href="links.html" class="footer__link">Links</a>
          <a href="archive.html" class="footer__link">Archive</a>
        </div>
      </div>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="js/main.js"></script>
  <script src="js/content-loader.js"></script>
</body>
</html>
